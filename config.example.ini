# 通用示例配置：按需填写。真实密码不要提交到仓库。
[source]
file = 收件人名单.xlsx
sheet =
# A 列 = 邮箱，B 列 = 数据(门票码/验证码/订单号…)
email_column = 1
body_column = 2
# 姓名来源：0 = 取邮箱前缀；有姓名列时填列号(如 C 列 = 3)
name_column = 0
has_header = true
data_start_row = 2

[mail]
# ---- SMTP 服务器 ----
smtp_host = smtp.example.com
# 587(STARTTLS) / 25(内网明文) / 465(SSL)
smtp_port = 587
encryption = starttls
# 登录账号：完整邮箱或域账号
user = you@example.com
password =
# 企业 AD 域名；普通邮箱可留空
domain =
# 登录名写法，留空则自动尝试 “域\\账号” 与 “账号@域”
login_user =
authentication = auto
# 发件地址(必须是完整邮箱；留空则 user 或 账号@域)
from_address =
from_name = 通知助手
# 统一主题
subject = 请查收本次活动信息
# 正文模板：{姓名}=姓名列或邮箱前缀，{数据}=B 列，{邮箱}{序号} 也可用，\\n 表示换行
body_template = {姓名}你好，现在发送信息给你{数据}，请查收。
# 每两封之间的间隔秒数
interval = 0.5
state_file = send_state.json
